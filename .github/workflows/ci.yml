name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Permite lanzar CI + deploy a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (lint · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: npm audit (informativo, no bloquea)
        run: npm audit --omit=dev
        continue-on-error: true

  python:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/requirements-dev.txt
      - run: pip install -r functions/requirements-dev.txt
      - run: python -m pytest functions/tests tests/pipeline -q
      - name: Validar dataset publicado (JSON de Hosting)
        run: python scripts/pipeline/export_web_data.py --check

  firestore-rules:
    name: Reglas Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global firebase-tools
      - run: npm ci
        working-directory: tests/firestore
      - run: firebase emulators:exec --only firestore --project demo-riskmap "node tests/firestore/firestore.rules.test.mjs"

  # CD: publica el frontend en Firebase Hosting solo si los checks de frontend y
  # API pasan, y el evento es un push (o lanzamiento manual) sobre `main`.
  deploy:
    name: Deploy (Firebase Hosting)
    # El deploy es solo Hosting: no depende del job de reglas Firestore (emulador),
    # que puede fallar por cambios de reglas sin relación con el frontend.
    needs: [frontend, python]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-hosting-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `firebase-config.json` está en .gitignore: se reconstruye desde el secreto
      # para que el build de producción incluya la configuración web.
      - name: Escribir config web de Firebase
        run: printf '%s' "$FIREBASE_WEB_CONFIG" > public/firebase-config.json
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
      - run: npm ci
      - run: npm run build
      # `secrets` no es válido dentro de `if`: comprobamos su presencia por env +
      # output y omitimos el deploy (run verde) si aún no existe el secreto.
      - name: Comprobar secreto de deploy
        id: guard
        run: |
          if [ -n "$SA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISKMAP_TESIS }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.guard.outputs.ok == 'true'
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISKMAP_TESIS }}
          projectId: riskmap-tesis
          channelId: live
